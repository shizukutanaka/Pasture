name: Release

# Tag-triggered binary distribution. RELEASE_CHECKLIST.md has claimed this
# file exists ("release.yml (tag-triggered binaries) — present; runs on tag
# push") since before it did; this makes the claim true. Merging this file
# publishes nothing: binaries are built only when a v* tag is pushed, or when
# a maintainer dispatches the workflow against an existing tag (which is how
# already-tagged releases such as v0.28.0 get their binaries retroactively).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.28.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x86_64
          # macos-latest is GitHub's current macOS image and runs on Apple
          # Silicon (arm64); Intel macOS is not built. The explicit macos-14
          # label was rejected by the runner pool ("The configuration
          # 'macos-14-arm64-us-default' is not supported"), so track latest.
          - os: macos-latest
            asset: macos-aarch64
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The release binaries are built WITH the `cloud` feature (ADR-285):
      # local/cloud routing is the headline behaviour — the README leads
      # with it — so a downloadable binary that cannot escalate to the
      # cloud makes the signage false. The MSRV promise is unchanged: it
      # covers the DEFAULT zero-dependency source build, which ci.yml's
      # gates job still verifies on the rust-toolchain.toml pin (1.75.0).
      # The cloud feature's pinned openssl declares rust-version 1.80, so
      # this job builds on stable with a directory override (the repo pin
      # would otherwise win inside the checkout) — the same approach as
      # ci.yml's cloud-feature job.
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # OpenSSL provisioning for openssl-sys (the cloud feature's pinned
      # TLS stack). The Linux image ships libssl-dev — the same guarantee
      # ci.yml's cloud-feature job relies on — so only macOS and Windows
      # need a step. Both link statically, so the shipped binary does not
      # depend on the end user's machine having OpenSSL installed.
      - name: Point openssl-sys at Homebrew OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # openssl@3 is preinstalled on the macOS images but keg-only,
          # so openssl-sys cannot find it without the explicit prefix.
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Install OpenSSL via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Windows image ships vcpkg but no OpenSSL dev package.
          # The static triplet keeps pasture.exe free of DLL companions.
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      # PASTURE_RELEASE_BUILD marks the binary as a release build at
      # compile time (ADR-286): `pasture update` (self-update) refuses to
      # run without it, so a source build can never replace itself with a
      # downloaded binary.
      - name: cargo build --release (cloud feature)
        run: cargo build --release --features cloud
        env:
          PASTURE_RELEASE_BUILD: "1"

      # The point of building with the feature is that the shipped binary
      # contains the cloud path — assert it, don't assume it. A non-cloud
      # build's `doctor` prints the "local-only build" line; a cloud build
      # prints the cloud fallback status instead. doctor's exit code
      # reflects other checks (e.g. no Ollama on the runner), so only the
      # output is asserted. PASTURE_LANG pins the message language.
      - name: Verify the binary contains the cloud path
        shell: bash
        run: |
          bin="target/release/pasture"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          out="$(PASTURE_LANG=en "$bin" doctor 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -q "local-only build"; then
            echo "::error::release binary was built WITHOUT the cloud feature"
            exit 1
          fi

      # Same shape for the self-update marker (ADR-286): point the
      # updater at a dead local address. A marked binary attempts the
      # check and fails with a network error; an unmarked one prints the
      # built-from-source refusal instead. Assert on the output, as with
      # doctor above.
      - name: Verify the binary carries the release-build marker
        shell: bash
        run: |
          bin="target/release/pasture"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          out="$(PASTURE_LANG=en PASTURE_UPDATE_API_BASE=http://127.0.0.1:9 "$bin" update --check 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -q "built from source"; then
            echo "::error::release binary was built WITHOUT the release marker (pasture update is disabled)"
            exit 1
          fi
          if ! echo "$out" | grep -q "Checking"; then
            echo "::error::pasture update did not attempt a check"
            exit 1
          fi

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="pasture-${{ steps.tag.outputs.tag }}-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp target/release/pasture "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "pasture-${{ steps.tag.outputs.tag }}-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/pasture.exe "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      # gh CLI rather than a marketplace release action, mirroring the
      # supply-chain stance ci.yml's cargo-deny job takes: this workflow
      # adds no third-party actions beyond the checkout/cache pair CI
      # already uses.
      - name: Upload to the GitHub Release for the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # Create the Release page if this tag does not have one yet;
          # if it already exists (e.g. v0.28.0), assets are added to it.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/pasture-"$tag"-${{ matrix.asset }}.* --clobber

  # The project's checksum practice, automated: once every platform
  # binary is uploaded, attach one SHA256SUMS file covering all of them.
  # `pasture update` verifies downloads against this file when present
  # (ADR-286). A separate job because the three binary jobs run in
  # parallel on different runners — each could only hash its own asset.
  checksums:
    name: checksums (SHA256SUMS)
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and upload SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          mkdir -p dl
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir dl --pattern "pasture-*"
          (cd dl && sha256sum pasture-* > SHA256SUMS)
          cat dl/SHA256SUMS
          gh release upload "$tag" dl/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
