name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (default — zero-dep)
        run: cargo build --release

      - name: Test (default build)
        run: cargo test

      - name: Clippy (default build)
        run: cargo clippy -- -D warnings

      # Informational only: the codebase uses a deliberate hand-rolled style,
      # not rustfmt's default. Surfaced for review, not enforced as a gate.
      - name: Rustfmt check (informational)
        continue-on-error: true
        run: cargo fmt --check

  supply-chain:
    name: Supply-chain audit (IMP-27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check
