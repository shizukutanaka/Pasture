ShortDescription: OpenAI-compatible local/cloud LLM routing proxy with hardware-adaptive thresholds
Description: >-
  Pasture is a zero-config, single-binary routing layer for individuals.
  It sends each request to a local model or escalates it to a cloud model
  depending on your hardware and the request, through OpenAI-compatible
  APIs. When no local inference engine is running, `pasture engine`
  downloads and starts the official Ollama build for your machine after
  verifying its checksum.
